# Stage config for Phase-1 MOSS-TTS-Delay.
#
# Scope
# -----
#   - offline / batch mode
#   - direct TTS prompts
#   - no reference-audio continuation
#   - no async-chunk streaming yet
#
# Hardware note
# -------------
# The Delay backbone is the 8B flagship model. In practice this is targeted at
# 80 GB+ GPUs for straightforward bf16 inference. The CAT codec stage is shared
# with MOSS-TTS-Local and reuses the same MOSS-Audio-Tokenizer checkpoint.

async_chunk: false

stage_args:
  - stage_id: 0
    stage_type: llm
    runtime:
      process: true
      devices: "0"

    engine_args:
      dtype: bfloat16
      max_num_seqs: 1
      model_stage: delay_ar_stage
      model_arch: MossTTSDelayModel
      worker_type: ar
      scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.72
      enforce_eager: true
      trust_remote_code: true
      enable_prefix_caching: false
      engine_output_type: latent
      max_model_len: 4096
      max_num_batched_tokens: 4096

    is_comprehension: true
    final_output: true
    final_output_type: text

    default_sampling_params:
      temperature: 1.5
      top_p: 1.0
      top_k: 50
      max_tokens: 900
      seed: 42
      detokenize: true
      repetition_penalty: 1.0

  - stage_id: 1
    stage_type: llm
    runtime:
      process: true
      devices: "0"

    engine_args:
      model_stage: decoder
      max_num_seqs: 1
      model_arch: MossTTSDelayModel
      worker_type: generation
      scheduler_cls: vllm_omni.core.sched.omni_generation_scheduler.OmniGenerationScheduler
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.22
      enforce_eager: true
      trust_remote_code: true
      enable_prefix_caching: false
      engine_output_type: audio
      max_model_len: 32768
      max_num_batched_tokens: 32768
      async_scheduling: false

    engine_input_source: [0]
    is_comprehension: false
    custom_process_input_func: vllm_omni.model_executor.stage_input_processors.moss_tts.llm2decoder_delay
    final_output: true
    final_output_type: audio

    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 32768
      seed: 42
      detokenize: false
